name: registry-ci

on:
  push: { branches: [main] }
  pull_request:
  # The artifact plane is regenerated daily so a rebuild that would fail is discovered on
  # a quiet day rather than on the day someone needs to merge (FS02-062: index-build-lite
  # is triggered by pushes, registry changes, and a daily cron).
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

# This workflow only validates and gates. It never writes to the repository, never
# publishes, and needs NO SECRETS — there is nothing in this repo that a token could be
# useful for. Least privilege is therefore literal: read the contents, nothing else.
permissions:
  contents: read

concurrency:
  group: registry-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history: the append-only guards compare the ledger and the CT log against a
        # BASE REVISION, and at the default fetch-depth of 1 that revision is not present —
        # the guards would announce themselves skipped on every run (they say so out loud,
        # but a permanently skipped guard is a guard nobody has).
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: Check out the published contracts (purposesource/spec)
        # The schema gate below validates every emitted artifact against the schemas the
        # PUBLIC spec repository ships — never a vendored copy, because a copy drifts and
        # drift is the exact thing the gate exists to catch. The repo is public, so no
        # token is needed or used. This checkout is untracked output: the hygiene step at
        # the end looks at tracked files only, so it stays clean.
        uses: actions/checkout@v4
        with:
          repository: purposesource/spec
          path: spec
          persist-credentials: false

      - name: Install
        run: npm ci

      # -------------------------------------------------- vendored contracts, byte-exact
      #
      # Two files here are NOT this repository's own: `schema/registry-v0-record.v1.json`
      # is the published record contract, and `config/category-funds.json` is the
      # published category menu. Both are vendored so this repository validates with
      # nothing but its own checkout — an OSPO that clones it needs no second download —
      # and vendoring without an equality check is just a fork with good intentions. So:
      # vendor, then assert equality, which is the pattern the config file's own comment
      # promises a reader.
      #
      # No token. The contract repository is public, so `actions/checkout` reads it with
      # the job's own read-only GITHUB_TOKEN and the workflow's `permissions:` block
      # stands unchanged. `main` is deliberately the ref: this repository must be level
      # with what is published right now, not with a tag someone forgot to move.
      #
      # PUBLICATION ORDER MATTERS, ONCE. Reading `main` means the two files must already
      # be published there. On the run that first introduces a vendored file, the contract
      # repository has to be published FIRST or this step takes its does-not-exist arm and
      # this workflow goes red — and, because it also runs on a daily cron, re-announces
      # that every morning until the contract set catches up. That red is a publication
      # order problem and never a corrupted vendored byte; the step's own error message
      # says so, so nobody has to guess from the log. Deliberately not softened to a
      # warning: a guard that shrugs at a file it cannot find would also shrug the day
      # this repository really is vendoring something that was never published.
      - name: Check out the published contract set
        uses: actions/checkout@v4
        with:
          repository: purposesource/spec
          ref: main
          path: .vendor-check/spec
          persist-credentials: false

      - name: Vendored files are byte-identical to the published contracts
        run: |
          set -eu
          fail=0
          # local path : published path
          for pair in \
            "schema/registry-v0-record.v1.json:schemas/registry-v0-record.v1.json" \
            "config/category-funds.json:examples/category-menu.v1.example.json"
          do
            here="${pair%%:*}"
            there=".vendor-check/spec/${pair#*:}"
            if [ ! -f "$there" ]; then
              echo "::error file=$here::the published contract set has no ${pair#*:}. The vendored bytes here are NOT in question. Either (a) this repository was published before the contract repository was — publish that one and re-run, this is the expected red on the run that first introduces a vendored file; or (b) the contract set moved or renamed the file, in which case re-vendor from its new path; or (c) this repository is vendoring something that was never published, which is the real defect this arm exists to catch."
              fail=1
            elif ! cmp -s "$here" "$there"; then
              echo "::error file=$here::differs from the published copy (${pair#*:}). This file is VENDORED: never edit it here. Change the published contract, then copy it back byte for byte."
              diff -u "$there" "$here" || true
              fail=1
            else
              echo "ok  $here == ${pair#*:}"
            fi
          done
          exit "$fail"

      # ---------------------------------------------------------------- copy law
      - name: Copy law (banned terms)
        # Narrow by design: a grep cannot tell a permitted MENTION of open source from a
        # forbidden self-description (MARKETING §1 rule 2), so this gate bans only the
        # enumerated hard cases and a human reviews prose. The canonical pattern file
        # lives in {ORG}/website at copy-lint/banned.txt (MKT-018); this is a vendored
        # subset. See the header of scripts/check-copy.mjs.
        run: npm run check:copy

      # ---------------------------------------------------------- registry validation
      - name: Validate every registry entry
        # FS02-061 + FS02-063: schema, filename agreement, node_id uniqueness and
        # decodability, enum membership, date sanity, the conditional weight-class
        # approval rule, the no-PII rule, and the ban on waivers ever entering the
        # registry (D14). Any failure fails the build — a broken registry never
        # half-publishes, because a half-published registry makes public claims about
        # other people's repositories.
        run: npm run validate

      # ------------------------------------------------------------ the artifact plane
      - name: Build the artifact plane (index-build-lite)
        # No GENERATED_AT is set, so the timestamp comes from the HEAD commit date. That
        # is deliberate: it makes the output of a given commit reproducible by anyone with
        # that commit, and it means an unchanged tree rebuilds to identical bytes
        # (FS02-084's "ETags change only on changed files").
        run: npm run build

      - name: Assert the emitted artifact set is exactly the FS-00 §6.2 catalog
        # Derives the expected path set a SECOND time, straight from the sources, and
        # compares. Also asserts the honesty invariants: empty waiver lists, no CHF figure
        # while nothing has been routed, no impact vocabulary, schemaVersion/generatedAt
        # on every artifact, and NO `example: true` identifier anywhere in the output.
        run: npm run check:artifacts

      - name: Emitted artifacts validate against the published spec schemas
        # The other half of check:artifacts. That gate asserts this repository's own
        # invariants; this one asserts the BYTES match the contract published to the world
        # in {ORG}/spec, which is what an adopter or a scanner validates with. Prints the
        # recorded divergence list on every run — the classes that need an FS-00 §6
        # amendment note before they can be enforced — and fails on anything not on it.
        env:
          PSN_SPEC_DIR: spec/schemas
        run: npm run check:schema

      - name: Build and check the demo plane (examples + fixture ledger/CT included)
        # The published plane is empty until real repositories are curated, which makes
        # most per-repo assertions above vacuous — and the check says so rather than
        # reporting a confident pass. This step holds the other end: it builds the same
        # generator over the seeded examples and the fixture ledger/CT so every artifact
        # SHAPE is exercised on every run. Its output is never publishable.
        env:
          PSN_SPEC_DIR: spec/schemas
        run: |
          npm run build:demo
          npm run check:artifacts:demo
          npm run check:schema:demo

      # ----------------------------------------------------- append-only enforcement
      - name: Resolve the append-only baseline
        id: baseline
        # The base revision the ledger and CT guards compare against. Candidates in order,
        # and the FIRST ONE THAT RESOLVES IN THIS CHECKOUT wins:
        #   1. pull_request -> the pull request's base commit, so a PR is judged against
        #                      what main holds.
        #   2. push         -> the commit this ref pointed at before the push, so a direct
        #                      push is judged against what was published.
        #   3. HEAD^        -> the previous commit of this lineage. Also the right answer
        #                      for schedule / dispatch, where nothing new should have
        #                      appeared at all.
        #
        # RESOLVING IS THE WHOLE POINT, and candidate 2 is why. On a REPUBLISHED repository
        # `github.event.before` is routinely a dead sha: publication rewrites commit
        # messages and strips private paths, so every publish produces new shas and the
        # pre-push tip is not in the new history. Handing the guards a sha that is not here
        # used to make them announce a skip and PASS — so on push events the retro-edit
        # guard had never once run against a resolvable baseline, every run reported
        # success, and a retro-edit to a published ledger row or CT entry would have gone
        # through. The chain checks cannot cover for that: a rewrite that re-hashes the
        # whole chain is internally perfect and only the baseline sees it.
        #
        # So this step now picks a revision that EXISTS, or fails. The only run that
        # legitimately has no baseline is a repository's first commit, where nothing has
        # been published and nothing can have been retro-edited; the guards report that
        # skip and the empty output below is how they are told.
        #
        # WHAT CANDIDATE 3 DOES AND DOES NOT PROVE. `HEAD^` proves the TIP commit
        # retro-edited nothing. A retro-edit made in an earlier commit of a multi-commit
        # push is not visible from there, and neither candidate 2 nor 3 is an INDEPENDENT
        # medium in CERT-032's sense — both live in the history publication rewrites, so
        # neither can prove that what the world downloaded last week is unedited. That
        # needs a baseline outside git: a digest carried in a published artifact, or a
        # deterministically republished tag. Which one is an open operator decision,
        # because it decides what the append-only law is mechanically checked against.
        # Until it is taken, this step says out loud which candidate it used.
        #
        # A STEP OUTPUT, not $GITHUB_ENV. A variable written to $GITHUB_ENV is exported to
        # every LATER step of the job, and the unit tests further down assert the guards'
        # own no-baseline branch ("append-only comparison SKIPPED"). An inherited baseline
        # hands those tests the thing they assert is absent, and four of them fail — which
        # is exactly what happened the day main got its second commit and HEAD^ began to
        # resolve. The two steps that need the value ask for it by name; nothing else in
        # the job can see it.
        # Event values arrive through `env:`, never interpolated into the script body: a
        # `${{ }}` inside `run:` is textual substitution into a shell, and this job's
        # least-privilege posture is worth keeping literal.
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          ZEROS=0000000000000000000000000000000000000000
          resolves() { [ -n "${1:-}" ] && git rev-parse --verify --quiet "$1^{commit}" >/dev/null; }

          pick=""
          why=""
          if resolves "${PR_BASE:-}"; then
            pick="$PR_BASE"
            why="the pull request's base commit"
          elif [ "${PUSH_BEFORE:-}" != "$ZEROS" ] && resolves "${PUSH_BEFORE:-}"; then
            pick="$PUSH_BEFORE"
            why="the commit this ref pointed at before the push, i.e. what was published"
          elif resolves "HEAD^"; then
            pick="$(git rev-parse HEAD^)"
            case "${PUSH_BEFORE:-}" in
              '')       said="no push event named an earlier commit (schedule or manual run)" ;;
              "$ZEROS") said="the push created this ref, so it named no earlier commit" ;;
              *)        said="github.event.before ($PUSH_BEFORE) is not in this checkout, which is the signature of a republished history" ;;
            esac
            why="HEAD^, the previous commit of this lineage; $said. The comparison is therefore narrowed to: the tip commit retro-edited nothing"
          fi

          if [ -n "$pick" ]; then
            echo "base=$pick" >> "$GITHUB_OUTPUT"
            echo "append-only baseline: $pick — $why"
            exit 0
          fi

          # A SHALLOW checkout counts one commit and is not a first commit. Asking the
          # question in that order matters: `git rev-list --count HEAD` returns 1 at
          # fetch-depth 1, so without this the fetch-depth failure mode the guards were
          # already worried about would be waved through as "nothing published yet".
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "::error::no append-only baseline resolves and this checkout is SHALLOW, so nothing here can tell a first commit from an unfetched history. The retro-edit guard cannot run, and a run that cannot enforce the append-only law must not report success (VS-28, VS-36). actions/checkout above needs fetch-depth: 0."
            exit 1
          fi

          if [ "$(git rev-list --count HEAD)" = "1" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "no append-only baseline: HEAD is this repository's first commit, so nothing has been published that could have been retro-edited. The guards will report the skip."
            exit 0
          fi

          echo "::error::no append-only baseline resolves in this checkout, and HEAD is not the first commit ($(git rev-list --count HEAD) commits). The retro-edit guard therefore cannot run, and a run that cannot enforce the append-only law must not report success (VS-28, VS-36). Check that actions/checkout above still uses fetch-depth: 0."
          exit 1

      - name: Verify the ledger chain and the append-only law
        # Recomputes every row hash from genesis AND compares against the baseline. Both
        # halves are needed: the chain proves internal consistency, while a rewrite that
        # re-hashes the whole chain is internally perfect and only the baseline sees it.
        #
        # An EMPTY value means "no baseline named" and the guard reports an honest skip; a
        # value that does not resolve now FAILS this step rather than skipping. That is why
        # the step above picks a revision that exists instead of passing one along and
        # hoping.
        env:
          PSN_BASE_REF: ${{ steps.baseline.outputs.base }}
        run: npm run verify:ledger

      - name: Verify the certificate-transparency log
        # Monotonic sequence, well-formed and unique hashes, revocations referencing
        # earlier entries, the segment hash chain, no type v0 cannot issue, no personal
        # data (CERT-031), and nothing edited or deleted since the baseline.
        env:
          PSN_BASE_REF: ${{ steps.baseline.outputs.base }}
        run: npm run verify:ct

      # ------------------------------------------------------------------- unit tests
      - name: Unit and gate tests
        run: npm run test:unit

      # ------------------------------------------------------------------- hygiene
      - name: Nothing generated is committed
        run: |
          # dist/ and dist-demo/ are regenerated on every run. A committed copy could
          # drift from its sources with nothing going red, which is the exact failure mode
          # the whole two-derivations design exists to prevent.
          for p in dist dist-demo node_modules; do
            if git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              echo "::error::$p is tracked in git. It is generated output and must stay ignored."
              exit 1
            fi
          done
          # And the working tree must be clean after a full run: every gate above reads,
          # none of them writes into tracked files.
          if ! git diff --exit-code --quiet; then
            echo "::error::the working tree changed during CI — a gate wrote to a tracked file."
            git diff --stat
            exit 1
          fi
          echo "clean"

      - name: Line endings are LF
        run: |
          # Every artifact in this repo is hashed, so a CRLF checkout would change the
          # bytes the append-only guards compare. .gitattributes pins the tree to LF; this
          # asserts nobody committed CRLF past it.
          if git grep -Il $'\r' -- ':!*.png' ':!*.pdf' >/dev/null 2>&1; then
            echo "::error::CRLF found in a tracked text file — the tree is LF-only (see .gitattributes)."
            git grep -Il $'\r' -- ':!*.png' ':!*.pdf'
            exit 1
          fi
          echo "LF only"
